<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿女記錄</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="阿女記錄">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input[type="datetime-local"] { font-size: 16px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Login -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm border shadow-sm">
      <h1 class="text-xl font-semibold text-center mb-6">阿女記錄</h1>
      <input id="email" type="email" placeholder="Email" class="w-full border rounded-xl px-4 py-3 mb-3" />
      <input id="password" type="password" placeholder="密碼（最少6個字）" class="w-full border rounded-xl px-4 py-3 mb-4" />
      <button id="loginBtn" class="w-full bg-black text-white py-3 rounded-xl font-medium mb-2">登入</button>
      <button id="signupBtn" class="w-full border py-3 rounded-xl font-medium">註冊</button>
      <p id="msg" class="text-center text-sm text-red-500 mt-3"></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-10">
      <div>
        <h1 class="font-semibold">阿女記錄</h1>
        <p id="date" class="text-xs text-gray-500"></p>
      </div>
      <div class="flex gap-2 text-sm">
        <button id="reportBtn" class="bg-black text-white px-3 py-1.5 rounded-full">報告</button>
        <button id="logoutBtn" class="text-gray-500">登出</button>
      </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-20">
      <div id="timerBox" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4 mb-4">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm text-rose-700">正在人奶</p>
            <p id="timerDisplay" class="text-3xl font-bold">00:00</p>
            <p id="timerSide" class="text-sm text-rose-600"></p>
          </div>
          <div class="space-y-2">
            <button id="switchBtn" class="block w-full px-4 py-2 bg-white rounded-xl">轉邊</button>
            <button id="stopBtn" class="block w-full px-4 py-2 bg-rose-500 text-white rounded-xl">停止</button>
          </div>
        </div>
      </div>

      <div class="space-y-3">
        <button data-form="breast" class="form-btn w-full bg-white border rounded-2xl p-5 flex items-center gap-4">
          <span class="text-4xl">🤱</span>
          <div class="text-left"><div class="font-semibold">人奶</div><div class="text-sm text-gray-500">計時 / 補錄</div></div>
        </button>
        <button data-form="bottle" class="form-btn w-full bg-white border rounded-2xl p-5 flex items-center gap-4">
          <span class="text-4xl">🍼</span>
          <div class="text-left"><div class="font-semibold">奶樽</div><div class="text-sm text-gray-500">人奶 / 配方</div></div>
        </button>
        <button data-form="solid" class="form-btn w-full bg-white border rounded-2xl p-5 flex items-center gap-4">
          <span class="text-4xl">🥣</span>
          <div class="text-left"><div class="font-semibold">副食</div><div class="text-sm text-gray-500">米粉、蔬菜等</div></div>
        </button>
        <button data-form="diaper" class="form-btn w-full bg-white border rounded-2xl p-5 flex items-center gap-4">
          <span class="text-4xl">💩</span>
          <div class="text-left"><div class="font-semibold">大便 / 小便</div><div class="text-sm text-gray-500">顏色、質地、尿量</div></div>
        </button>
      </div>

      <div class="mt-6">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-semibold text-gray-500">今日記錄</h2>
          <button id="clearBtn" class="text-xs text-gray-400">清除今日</button>
        </div>
        <div id="list" class="space-y-2"></div>
        <div id="empty" class="text-center py-10 text-gray-400 text-sm">今日未有記錄</div>
      </div>
    </main>
  </div>

  <!-- Form Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end">
    <div class="bg-white w-full max-h-[90vh] overflow-auto rounded-t-3xl">
      <div class="sticky top-0 bg-white px-5 py-3 border-b flex justify-between">
        <h3 id="modalTitle" class="font-semibold"></h3>
        <button id="closeModal" class="text-xl">✕</button>
      </div>
      <div id="modalBody" class="p-5 space-y-4"></div>
      <div class="p-5 pt-0">
        <button id="saveBtn" class="w-full bg-black text-white py-3.5 rounded-2xl font-medium">儲存</button>
      </div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="reportModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end">
    <div class="bg-white w-full max-h-[90vh] overflow-auto rounded-t-3xl p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold">報告</h3>
        <button id="closeReport" class="text-xl">✕</button>
      </div>
      <div class="flex gap-2 mb-4 text-sm">
        <button id="tabToday" class="flex-1 py-2 rounded-xl bg-black text-white">今日</button>
        <button id="tabWeek" class="flex-1 py-2 rounded-xl border">本週</button>
        <button id="tabMonth" class="flex-1 py-2 rounded-xl border">本月</button>
      </div>
      <pre id="reportText" class="text-sm whitespace-pre-wrap font-mono"></pre>
      <div class="flex gap-2 mt-4">
        <button id="copyBtn" class="flex-1 bg-black text-white py-3 rounded-2xl">複製</button>
        <button id="exportBtn" class="flex-1 border py-3 rounded-2xl">匯出 Excel</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://anyqinxnwsnsxfchzwsu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_kdOnsZo8ShQmzkg8Xno2sg_YwT9BJlV';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentForm = null;
    let timer = null;
    let timerInt = null;
    let user = null;
    let currentTab = 'today';

    const foods = ['米粉','南瓜','紅蘿蔔','西蘭花','菠菜','薯仔','番薯','蘋果','香蕉','牛油果','蛋黃','魚肉','雞肉','其他'];
    const colors = ['黃色','芥末黃','綠色','啡色','黑色','白色','紅色'];
    const textures = ['軟','糊狀','水狀','硬粒','正常成形','黏稠'];

    // 正確本地時間（香港）
    function nowLocal() {
      const d = new Date();
      const offset = d.getTimezoneOffset() * 60000;
      return new Date(d - offset).toISOString().slice(0, 16);
    }

    function msg(t) { document.getElementById('msg').textContent = t; }

    async function init() {
      // 恢復上次用嘅 email
      const saved = localStorage.getItem('savedEmail');
      if (saved) document.getElementById('email').value = saved;

      // 監聽登入狀態變化
      sb.auth.onAuthStateChange((event, session) => {
        if (session) {
          user = session.user;
          showApp();
        } else {
          document.getElementById('loginScreen').classList.remove('hidden');
          document.getElementById('app').classList.add('hidden');
        }
      });

      // 檢查現有 session
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        user = session.user;
        showApp();
      }
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      if (!email || pw.length < 6) return msg('請輸入有效 Email 同至少6位密碼');
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) {
        msg(error.message);
        return;
      }
      // 記住 email
      localStorage.setItem('savedEmail', email);
      // 唔使 reload，直接顯示 app
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        user = session.user;
        showApp();
      }
    }

    async function doSignup() {
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      if (!email || pw.length < 6) return msg('請輸入有效 Email 同至少6位密碼');
      const { error } = await sb.auth.signUp({ email, password: pw });
      if (error) msg(error.message);
      else msg('註冊成功，請登入');
    }

    function showApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('date').textContent = new Date().toLocaleDateString('zh-HK', {month:'long', day:'numeric', weekday:'short'});
      loadToday();
      sb.channel('realtime').on('postgres_changes', {event:'*', schema:'public', table:'events'}, loadToday).subscribe();
    }

    async function loadToday() {
      const d = new Date();
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString();
      const end = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1).toISOString();
      const { data, error } = await sb.from('events').select('*').gte('time', start).lt('time', end).order('time', {ascending:false});
      if (error) { console.error(error); return; }
      renderList(data || []);
    }

    function renderList(items) {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      if (!items.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      list.innerHTML = items.map(e => `
        <div class="bg-white border rounded-2xl p-4 flex gap-3 text-sm">
          <div class="text-2xl">${{diaper_pee:'💧',diaper_poop:'💩',diaper_both:'💧💩',breastfeed:'🤱',bottle:'🍼',solid:'🥣'}[e.type]||'📝'}</div>
          <div class="flex-1">
            <div class="font-medium">${{diaper_pee:'小便',diaper_poop:'大便',diaper_both:'大便+小便',breastfeed:'人奶',bottle:'奶樽',solid:'副食'}[e.type]}</div>
            <div class="text-gray-500">${new Date(e.time).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}</div>
            ${e.detail?`<div class="text-gray-600">${e.detail}</div>`:''}
          </div>
          <div class="flex flex-col gap-1">
            <button onclick="editEvent('${e.id}')" class="text-xs text-blue-500">編輯</button>
            <button onclick="del('${e.id}')" class="text-gray-300 text-lg">✕</button>
          </div>
        </div>
      `).join('');
    }

    async function editEvent(id) {
      const { data, error } = await sb.from('events').select('*').eq('id', id).single();
      if (error || !data) return alert('搵唔到記錄');
      
      // Map type back to form type
      const typeMap = {
        breastfeed: 'breast',
        bottle: 'bottle',
        solid: 'solid',
        diaper_pee: 'diaper',
        diaper_poop: 'diaper',
        diaper_both: 'diaper'
      };
      const formType = typeMap[data.type] || 'diaper';
      
      openModal(formType, data);
    }

    function openModal(type, existing = null) {
      currentForm = type;
      window.editingId = existing?.id || null;
      document.getElementById('modal').classList.remove('hidden');
      const titles = {breast:'人奶', bottle:'奶樽', solid:'副食', diaper:'大便 / 小便'};
      document.getElementById('modalTitle').textContent = (existing ? '編輯 ' : '') + titles[type];
      const body = document.getElementById('modalBody');
      
      const localTime = existing ? new Date(existing.time) : new Date();
      const offset = localTime.getTimezoneOffset() * 60000;
      const timeValue = new Date(localTime - offset).toISOString().slice(0, 16);
      const time = `<div><label class="text-sm">時間</label><input type="datetime-local" id="t" value="${timeValue}" class="w-full border rounded-xl px-3 py-3 mt-1"></div>`;

      if (type === 'breast') {
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-3">
            <button id="left" class="py-5 bg-rose-50 border rounded-2xl">左邊開始</button>
            <button id="right" class="py-5 bg-rose-50 border rounded-2xl">右邊開始</button>
          </div>
          <p class="text-center text-xs text-gray-400">或補錄</p>
          ${time}
          <select id="side" class="w-full border rounded-xl px-3 py-3"><option value="left">左邊</option><option value="right">右邊</option></select>
          <input id="mins" type="number" placeholder="分鐘" class="w-full border rounded-xl px-3 py-3">
        `;
        document.getElementById('left').onclick = () => startTimer('left');
        document.getElementById('right').onclick = () => startTimer('right');
        if (existing?.detail) {
          if (existing.detail.includes('右')) document.getElementById('side').value = 'right';
          const m = existing.detail.match(/(\d+)分/);
          if (m) document.getElementById('mins').value = m[1];
        }
      } else if (type === 'bottle') {
        body.innerHTML = time + `
          <div class="flex gap-2">
            <button data-bt="breast" class="bt flex-1 py-3 border rounded-xl">人奶</button>
            <button data-bt="formula" class="bt flex-1 py-3 border rounded-xl">配方奶</button>
          </div>
          <div class="grid grid-cols-4 gap-2" id="mls"></div>
          <input id="ml" type="number" placeholder="自訂 ml" class="w-full border rounded-xl px-3 py-3">
        `;
        const mls = [100,110,120,130,140,150,160,170,180];
        document.getElementById('mls').innerHTML = mls.map(m=>`<button class="mlb py-2 border rounded-xl text-sm">${m}</button>`).join('');
        document.querySelectorAll('.mlb').forEach(b=>b.onclick=()=>{document.getElementById('ml').value=b.textContent});
        document.querySelectorAll('.bt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bt').forEach(x=>x.classList.remove('bg-rose-50'));b.classList.add('bg-rose-50');window.bt=b.dataset.bt});
        window.bt = 'breast';
        if (existing?.detail) {
          const mlMatch = existing.detail.match(/(\d+)ml/);
          if (mlMatch) document.getElementById('ml').value = mlMatch[1];
          if (existing.detail.includes('配方')) {
            window.bt = 'formula';
            document.querySelector('[data-bt="formula"]').classList.add('bg-rose-50');
          } else {
            document.querySelector('[data-bt="breast"]').classList.add('bg-rose-50');
          }
        } else {
          document.querySelector('[data-bt="breast"]').classList.add('bg-rose-50');
        }
      } else if (type === 'solid') {
        body.innerHTML = time + `
          <div class="flex flex-wrap gap-2" id="foods"></div>
          <input id="foodCustom" placeholder="其他" class="w-full border rounded-xl px-3 py-3">
          <input id="amount" placeholder="份量 (ml / 匙)" class="w-full border rounded-xl px-3 py-3">
        `;
        document.getElementById('foods').innerHTML = foods.map(f=>`<button class="fb px-3 py-1 border rounded-full text-sm">${f}</button>`).join('');
        document.querySelectorAll('.fb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fb').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.food=b.textContent});
        if (existing?.detail) {
          const parts = existing.detail.split(' · ');
          window.food = parts[0];
          document.getElementById('foodCustom').value = parts[0];
          if (parts[1]) document.getElementById('amount').value = parts[1];
          document.querySelectorAll('.fb').forEach(b => {
            if (b.textContent === parts[0]) b.classList.add('bg-black','text-white');
          });
        }
      } else if (type === 'diaper') {
        body.innerHTML = time + `
          <div class="grid grid-cols-3 gap-2">
            <button data-dt="pee" class="dt py-3 border rounded-xl">小便</button>
            <button data-dt="poop" class="dt py-3 border rounded-xl">大便</button>
            <button data-dt="both" class="dt py-3 border rounded-xl">兩者</button>
          </div>
          <div id="peeBox" class="hidden">
            <div class="grid grid-cols-3 gap-2 mt-3">
              <button data-pl="1X" class="pl py-3 border rounded-xl">正常</button>
              <button data-pl="2X" class="pl py-3 border rounded-xl">多</button>
              <button data-pl="3X" class="pl py-3 border rounded-xl">爆片</button>
            </div>
          </div>
          <div id="poopBox" class="space-y-3 mt-3">
            <div class="flex flex-wrap gap-2" id="colors"></div>
            <div class="flex flex-wrap gap-2" id="texts"></div>
          </div>
        `;
        document.querySelectorAll('.dt').forEach(b=>b.onclick=()=>{
          document.querySelectorAll('.dt').forEach(x=>x.classList.remove('bg-black','text-white'));
          b.classList.add('bg-black','text-white');
          const isPee = b.dataset.dt==='pee';
          document.getElementById('peeBox').classList.toggle('hidden', !isPee);
          document.getElementById('poopBox').classList.toggle('hidden', isPee);
          window.dt = b.dataset.dt;
        });
        document.querySelectorAll('.pl').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pl').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.pl=b.dataset.pl});
        document.getElementById('colors').innerHTML = colors.map(c=>`<button class="cb px-3 py-1 border rounded-full text-sm">${c}</button>`).join('');
        document.getElementById('texts').innerHTML = textures.map(t=>`<button class="tb px-3 py-1 border rounded-full text-sm">${t}</button>`).join('');
        document.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cb').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.color=b.textContent});
        document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.texture=b.textContent});
        
        // Pre-fill for edit
        if (existing) {
          const dt = existing.type === 'diaper_pee' ? 'pee' : existing.type === 'diaper_both' ? 'both' : 'poop';
          window.dt = dt;
          document.querySelector(`[data-dt="${dt}"]`)?.classList.add('bg-black','text-white');
          const isPee = dt === 'pee';
          document.getElementById('peeBox').classList.toggle('hidden', !isPee);
          document.getElementById('poopBox').classList.toggle('hidden', isPee);
          if (existing.detail) {
            if (existing.detail.includes('2X')) window.pl = '2X';
            else if (existing.detail.includes('3X')) window.pl = '3X';
            else window.pl = '1X';
            document.querySelector(`[data-pl="${window.pl}"]`)?.classList.add('bg-black','text-white');
            const parts = existing.detail.split(' · ');
            if (parts[0]) { window.color = parts[0]; document.querySelectorAll('.cb').forEach(b => { if(b.textContent===parts[0]) b.classList.add('bg-black','text-white'); }); }
            if (parts[1]) { window.texture = parts[1]; document.querySelectorAll('.tb').forEach(b => { if(b.textContent===parts[1]) b.classList.add('bg-black','text-white'); }); }
          }
        } else {
          window.dt = 'poop';
          document.querySelector('[data-dt="poop"]').classList.add('bg-black','text-white');
          window.pl = '1X';
        }
      }
    }

      if (type === 'breast') {
        body.innerHTML = `
          <div class="grid grid-cols-2 gap-3">
            <button id="left" class="py-5 bg-rose-50 border rounded-2xl">左邊開始</button>
            <button id="right" class="py-5 bg-rose-50 border rounded-2xl">右邊開始</button>
          </div>
          <p class="text-center text-xs text-gray-400">或補錄</p>
          ${time}
          <select id="side" class="w-full border rounded-xl px-3 py-3"><option value="left">左邊</option><option value="right">右邊</option></select>
          <input id="mins" type="number" placeholder="分鐘" class="w-full border rounded-xl px-3 py-3">
        `;
        document.getElementById('left').onclick = () => startTimer('left');
        document.getElementById('right').onclick = () => startTimer('right');
      } else if (type === 'bottle') {
        body.innerHTML = time + `
          <div class="flex gap-2">
            <button data-bt="breast" class="bt flex-1 py-3 border rounded-xl bg-rose-50">人奶</button>
            <button data-bt="formula" class="bt flex-1 py-3 border rounded-xl">配方奶</button>
          </div>
          <div class="grid grid-cols-4 gap-2" id="mls"></div>
          <input id="ml" type="number" placeholder="自訂 ml" class="w-full border rounded-xl px-3 py-3">
        `;
        const mls = [100,110,120,130,140,150,160,170,180];
        document.getElementById('mls').innerHTML = mls.map(m=>`<button class="mlb py-2 border rounded-xl text-sm">${m}</button>`).join('');
        document.querySelectorAll('.mlb').forEach(b=>b.onclick=()=>{document.getElementById('ml').value=b.textContent});
        document.querySelectorAll('.bt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bt').forEach(x=>x.classList.remove('bg-rose-50'));b.classList.add('bg-rose-50');window.bt=b.dataset.bt});
        window.bt = 'breast';
      } else if (type === 'solid') {
        body.innerHTML = time + `
          <div class="flex flex-wrap gap-2" id="foods"></div>
          <input id="foodCustom" placeholder="其他" class="w-full border rounded-xl px-3 py-3">
          <input id="amount" placeholder="份量 (ml / 匙)" class="w-full border rounded-xl px-3 py-3">
        `;
        document.getElementById('foods').innerHTML = foods.map(f=>`<button class="fb px-3 py-1 border rounded-full text-sm">${f}</button>`).join('');
        document.querySelectorAll('.fb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fb').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.food=b.textContent});
      } else if (type === 'diaper') {
        body.innerHTML = time + `
          <div class="grid grid-cols-3 gap-2">
            <button data-dt="pee" class="dt py-3 border rounded-xl">小便</button>
            <button data-dt="poop" class="dt py-3 border rounded-xl bg-black text-white">大便</button>
            <button data-dt="both" class="dt py-3 border rounded-xl">兩者</button>
          </div>
          <div id="peeBox" class="hidden">
            <div class="grid grid-cols-3 gap-2 mt-3">
              <button data-pl="1X" class="pl py-3 border rounded-xl">正常</button>
              <button data-pl="2X" class="pl py-3 border rounded-xl">多</button>
              <button data-pl="3X" class="pl py-3 border rounded-xl">爆片</button>
            </div>
          </div>
          <div id="poopBox" class="space-y-3 mt-3">
            <div class="flex flex-wrap gap-2" id="colors"></div>
            <div class="flex flex-wrap gap-2" id="texts"></div>
          </div>
        `;
        document.querySelectorAll('.dt').forEach(b=>b.onclick=()=>{
          document.querySelectorAll('.dt').forEach(x=>x.classList.remove('bg-black','text-white'));
          b.classList.add('bg-black','text-white');
          const isPee = b.dataset.dt==='pee';
          document.getElementById('peeBox').classList.toggle('hidden', !isPee);
          document.getElementById('poopBox').classList.toggle('hidden', isPee);
          window.dt = b.dataset.dt;
        });
        document.querySelectorAll('.pl').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pl').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.pl=b.dataset.pl});
        document.getElementById('colors').innerHTML = colors.map(c=>`<button class="cb px-3 py-1 border rounded-full text-sm">${c}</button>`).join('');
        document.getElementById('texts').innerHTML = textures.map(t=>`<button class="tb px-3 py-1 border rounded-full text-sm">${t}</button>`).join('');
        document.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cb').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.color=b.textContent});
        document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');window.texture=b.textContent});
        window.dt = 'poop';
        window.pl = '1X';
      }
    }

    async function save() {
      const t = document.getElementById('t')?.value;
      if (!t) return alert('請選時間');
      let event = { time: new Date(t).toISOString(), created_by: user?.id };

      if (currentForm === 'breast') {
        event.type = 'breastfeed';
        event.detail = `${document.getElementById('side').value==='left'?'左':'右'} · ${document.getElementById('mins').value||'?'}分鐘`;
      } else if (currentForm === 'bottle') {
        const ml = document.getElementById('ml').value;
        if (!ml) return alert('請輸入份量');
        event.type = 'bottle';
        event.detail = `${ml}ml · ${window.bt==='formula'?'配方奶':'人奶'}`;
      } else if (currentForm === 'solid') {
        const food = window.food || document.getElementById('foodCustom').value;
        if (!food) return alert('請選食物');
        event.type = 'solid';
        event.detail = food + (document.getElementById('amount').value ? ' · ' + document.getElementById('amount').value : '');
      } else if (currentForm === 'diaper') {
        const dt = window.dt || 'poop';
        event.type = dt==='pee'?'diaper_pee':dt==='both'?'diaper_both':'diaper_poop';
        if (dt==='pee') {
          const pl = window.pl||'1X';
          event.detail = pl==='1X'?'':(pl==='2X'?'多 (2X)':'爆片 (3X)');
        } else {
          event.detail = [window.color, window.texture].filter(Boolean).join(' · ');
        }
      }

      let error;
      if (window.editingId) {
        // Update existing
        const res = await sb.from('events').update(event).eq('id', window.editingId);
        error = res.error;
        window.editingId = null;
      } else {
        // Insert new
        const res = await sb.from('events').insert(event);
        error = res.error;
      }
      
      if (error) return alert(error.message);
      document.getElementById('modal').classList.add('hidden');
      loadToday();
    }

    function startTimer(side) {
      document.getElementById('modal').classList.add('hidden');
      timer = { start: Date.now(), side, switches: 0 };
      document.getElementById('timerBox').classList.remove('hidden');
      updateTimer();
      timerInt = setInterval(updateTimer, 1000);
    }
    function updateTimer() {
      const s = Math.floor((Date.now()-timer.start)/1000);
      document.getElementById('timerDisplay').textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
      document.getElementById('timerSide').textContent = `由${timer.side==='left'?'左':'右'}開始`;
    }
    async function stopTimer() {
      clearInterval(timerInt);
      const s = Math.round((Date.now()-timer.start)/1000);
      const event = {
        type: 'breastfeed',
        time: new Date().toISOString(),
        detail: `由${timer.side==='left'?'左':'右'}開始 · ${Math.floor(s/60)}分${s%60}秒`,
        duration: s,
        start_side: timer.side,
        created_by: user?.id
      };
      await sb.from('events').insert(event);
      document.getElementById('timerBox').classList.add('hidden');
      timer = null;
      loadToday();
    }

    async function del(id) {
      if (!confirm('刪除？')) return;
      await sb.from('events').delete().eq('id', id);
      loadToday();
    }

    async function clearToday() {
      if (!confirm('清除今日？')) return;
      const d = new Date();
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString();
      const end = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1).toISOString();
      await sb.from('events').delete().gte('time', start).lt('time', end);
      loadToday();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabToday').className = 'flex-1 py-2 rounded-xl ' + (tab==='today'?'bg-black text-white':'border');
      document.getElementById('tabWeek').className = 'flex-1 py-2 rounded-xl ' + (tab==='week'?'bg-black text-white':'border');
      document.getElementById('tabMonth').className = 'flex-1 py-2 rounded-xl ' + (tab==='month'?'bg-black text-white':'border');
      showReport();
    }

    async function showReport() {
      document.getElementById('reportModal').classList.remove('hidden');
      const now = new Date();
      let text = '';

      if (currentTab === 'today') {
        const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
        const end = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1).toISOString();
        const { data } = await sb.from('events').select('*').gte('time', start).lt('time', end).order('time');
        const date = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric', weekday:'short'});
        const feeds = data?.filter(e=>e.type==='breastfeed'||e.type==='bottle')||[];
        const solids = data?.filter(e=>e.type==='solid')||[];
        const pees = data?.filter(e=>e.type==='diaper_pee'||e.type==='diaper_both')||[];
        const poops = data?.filter(e=>e.type==='diaper_poop'||e.type==='diaper_both')||[];
        text = `【今日報告】${date}\n\n🍼 食奶 (${feeds.length}次)\n`;
        feeds.forEach(e=>text+=`  ${new Date(e.time).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}  ${e.detail||''}\n`);
        text += `\n🥣 副食 (${solids.length}次)\n`;
        solids.forEach(e=>text+=`  ${new Date(e.time).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}  ${e.detail||''}\n`);
        text += `\n💧 小便 (${pees.length}次)\n`;
        pees.forEach(e=>text+=`  ${new Date(e.time).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}  ${e.detail||''}\n`);
        text += `\n💩 大便 (${poops.length}次)\n`;
        poops.forEach(e=>text+=`  ${new Date(e.time).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}  ${e.detail||''}\n`);
      }
      else if (currentTab === 'week') {
        const start = new Date(now);
        start.setDate(now.getDate() - 6);
        start.setHours(0,0,0,0);
        const { data } = await sb.from('events').select('*').gte('time', start.toISOString()).order('time');
        text = '【本週總覽】最近 7 日\n\n';
        text += '日期        食奶  副食  小便  大便\n';
        text += '────────────────────────────\n';
        for (let i = 6; i >= 0; i--) {
          const day = new Date(now);
          day.setDate(now.getDate() - i);
          const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
          const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
          const dayEvents = (data||[]).filter(e => new Date(e.time) >= dayStart && new Date(e.time) < dayEnd);
          const feeds = dayEvents.filter(e=>e.type==='breastfeed'||e.type==='bottle').length;
          const solids = dayEvents.filter(e=>e.type==='solid').length;
          const pees = dayEvents.filter(e=>e.type==='diaper_pee'||e.type==='diaper_both').length;
          const poops = dayEvents.filter(e=>e.type==='diaper_poop'||e.type==='diaper_both').length;
          const label = day.toLocaleDateString('zh-HK', {month:'numeric', day:'numeric', weekday:'short'});
          text += `${label.padEnd(10)} ${String(feeds).padStart(3)}   ${String(solids).padStart(3)}   ${String(pees).padStart(3)}   ${String(poops).padStart(3)}\n`;
        }
      }
      else if (currentTab === 'month') {
        const start = new Date(now.getFullYear(), now.getMonth(), 1);
        const { data } = await sb.from('events').select('*').gte('time', start.toISOString()).order('time');
        text = `【本月總覽】${now.getFullYear()}年${now.getMonth()+1}月\n\n`;
        text += '日期        食奶  副食  小便  大便\n';
        text += '────────────────────────────\n';
        const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const day = new Date(now.getFullYear(), now.getMonth(), d);
          if (day > now) break;
          const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate());
          const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
          const dayEvents = (data||[]).filter(e => new Date(e.time) >= dayStart && new Date(e.time) < dayEnd);
          const feeds = dayEvents.filter(e=>e.type==='breastfeed'||e.type==='bottle').length;
          const solids = dayEvents.filter(e=>e.type==='solid').length;
          const pees = dayEvents.filter(e=>e.type==='diaper_pee'||e.type==='diaper_both').length;
          const poops = dayEvents.filter(e=>e.type==='diaper_poop'||e.type==='diaper_both').length;
          if (feeds+solids+pees+poops === 0) continue;
          const label = `${d}日`;
          text += `${label.padEnd(10)} ${String(feeds).padStart(3)}   ${String(solids).padStart(3)}   ${String(pees).padStart(3)}   ${String(poops).padStart(3)}\n`;
        }
      }

      document.getElementById('reportText').textContent = text;
      window.report = text;
    }

    async function exportCSV() {
      const { data } = await sb.from('events').select('*').order('time', { ascending: true });
      if (!data || !data.length) return alert('冇資料可以匯出');

      const headers = ['日期', '時間', '類型', '詳細', '時長(秒)'];
      const rows = data.map(e => {
        const d = new Date(e.time);
        const date = d.toLocaleDateString('zh-HK');
        const time = d.toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit'});
        const typeMap = {diaper_pee:'小便', diaper_poop:'大便', diaper_both:'大便+小便', breastfeed:'人奶', bottle:'奶樽', solid:'副食'};
        return [date, time, typeMap[e.type]||e.type, e.detail||'', e.duration||''];
      });

      const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `阿女記錄_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Events
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('signupBtn').onclick = doSignup;
    document.getElementById('logoutBtn').onclick = () => sb.auth.signOut().then(()=>location.reload());
    document.getElementById('reportBtn').onclick = () => { currentTab='today'; setTab('today'); };
    document.getElementById('clearBtn').onclick = clearToday;
    document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.add('hidden');
    document.getElementById('saveBtn').onclick = save;
    document.getElementById('closeReport').onclick = () => document.getElementById('reportModal').classList.add('hidden');
    document.getElementById('copyBtn').onclick = () => navigator.clipboard.writeText(window.report||'');
    document.getElementById('exportBtn').onclick = exportCSV;
    document.getElementById('switchBtn').onclick = () => { if(timer){ timer.side = timer.side==='left'?'right':'left'; timer.switches++; updateTimer(); } };
    document.getElementById('stopBtn').onclick = stopTimer;
    document.getElementById('tabToday').onclick = () => setTab('today');
    document.getElementById('tabWeek').onclick = () => setTab('week');
    document.getElementById('tabMonth').onclick = () => setTab('month');
    document.querySelectorAll('.form-btn').forEach(b => b.onclick = () => openModal(b.dataset.form));

    init();
  </script>
</body>
</html>
